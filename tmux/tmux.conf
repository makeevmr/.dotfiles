# remap prefix from 'C-b' to 'C-w'
unbind C-b
set-option -g prefix C-w
bind C-w send-prefix

# Reload tmux configuration
bind-key r source-file ~/.dotfiles/tmux/tmux.conf \; display-message "tmux configuration reloaded"

set-option -g default-shell /usr/bin/zsh

# Enable mouse mode
set -g mouse on

# Increase scrollback buffer size from 2000 to 50000 lines
set -g history-limit 50000

# Increase tmux display time for panes
set -g display-panes-time 5000

# Split panes using v and b
unbind '"'
unbind %
bind-key v split-window -v
bind-key b split-window -h

# Swap with window to the right, then move to that window
bind-key > swap-window -t +1 \; select-window -t +1

# Swap with window to the left, then move to that window  
bind-key < swap-window -t -1 \; select-window -t -1

# Using prefix + h/j/k/l to move between panes
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Using prefix + H/J/K/L to swap between panes
bind-key J swap-pane -D
bind-key K swap-pane -U

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Use vi keys in copy mode
set-window-option -g mode-keys vi

# Characterwise selection with v
bind-key -T copy-mode-vi v send -X begin-selection

# Linewise selection with V
bind-key -T copy-mode-vi V send -X select-line

# Blockwise selection with Ctrl-v
bind-key -T copy-mode-vi C-v send -X begin-selection \; send -X rectangle-on

# Yank selection with 'y'
bind-key -T copy-mode-vi y send -X copy-selection

# Default Terminal Mode to 256 Colors
set -g default-terminal "xterm-256color"

# Override Terminal Mode to 256 Colors
set -ga terminal-overrides ",xterm-256color:Tc"

# Tokyo Night theme
set -g mode-style fg=#7aa2f7,bg=#3b4261
set -g clock-mode-colour "#7aa2f7"

# Pane border
set -g pane-border-style fg=#3b4261
set -g pane-active-border-style fg=#7aa2f7

# Status bar
# Windows use Tokyo Night green; only the current window is bold.
# Session metadata uses the same Tokyo Night gold throughout.
set -g status-style fg=#e0af68,bg=#16161e
set -g status-left "#[fg=#e0af68][#S] "
set -g window-status-style fg=#9ece6a,bg=#16161e,nobold
set -g window-status-current-style fg=#9ece6a,bg=#16161e,bold
set -g status-right "#[fg=#e0af68]#(date +%a) | #H "

# Message/input 
set -g message-style fg=#c0caf5,bg=#3b4261
set -g message-command-style fg=#c0caf5,bg=#3b4261

# List of TPM plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Initialize TPM 
run '~/.tmux/plugins/tpm/tpm'
